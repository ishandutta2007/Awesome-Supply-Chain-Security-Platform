<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a13" />
    </linearGradient>

    <!-- Glowing Text Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#818cf8;#34d399;#38bdf8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#818cf8">
        <animate attributeName="stop-color" values="#818cf8;#34d399;#38bdf8;#818cf8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#34d399">
        <animate attributeName="stop-color" values="#34d399;#38bdf8;#818cf8;#34d399" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Accent Gradient for Shield -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Pattern Grid -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" opacity="0.6" />
      <circle cx="40" cy="40" r="1" fill="#38bdf8" opacity="0.3">
        <animate attributeName="opacity" values="0.2;0.8;0.2" dur="3s" repeatCount="indefinite" />
      </circle>
    </pattern>

    <!-- Animations -->
    <style>
      .pulse-fast { animation: pulse 2s infinite ease-in-out; }
      .pulse-slow { animation: pulse 4s infinite ease-in-out; }
      .flow-line { stroke-dasharray: 8, 8; animation: dash 12s linear infinite; }
      .flow-reverse { stroke-dasharray: 6, 6; animation: dash-rev 15s linear infinite; }
      .float-shield { animation: float 6s ease-in-out infinite; }
      .radar-sweep { transform-origin: 1040px 180px; animation: rotate 8s linear infinite; }

      @keyframes dash {
        to { stroke-dashoffset: -1000; }
      }
      @keyframes dash-rev {
        to { stroke-dashoffset: 1000; }
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.85; transform: scale(1.04); }
      }
      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes rotate {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="360" rx="16" fill="url(#grid)" />

  <!-- Animated Supply Chain Network Lines -->
  <g opacity="0.65">
    <!-- Top pipeline line -->
    <path d="M 50 80 Q 300 30, 600 80 T 1150 80" fill="none" stroke="#0ea5e9" stroke-width="1.5" class="flow-line" />
    <!-- Bottom pipeline line -->
    <path d="M 50 280 Q 400 330, 750 280 T 1150 280" fill="none" stroke="#10b981" stroke-width="1.5" class="flow-reverse" />
    <!-- Cross connecting lines -->
    <path d="M 160 80 L 280 280 M 420 80 L 520 280 M 680 80 L 800 280 M 940 80 L 1060 280" fill="none" stroke="#6366f1" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="4, 4" />
  </g>

  <!-- Decorative Radar / Scanner Effect on Right Side -->
  <g opacity="0.4">
    <circle cx="1040" cy="180" r="110" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.2" />
    <circle cx="1040" cy="180" r="75" fill="none" stroke="#6366f1" stroke-width="1" stroke-opacity="0.3" />
    <circle cx="1040" cy="180" r="40" fill="none" stroke="#34d399" stroke-width="1" stroke-opacity="0.4" />
    <line x1="1040" y1="180" x2="1140" y2="180" stroke="#38bdf8" stroke-width="2" class="radar-sweep" stroke-linecap="round" filter="url(#softGlow)" />
  </g>

  <!-- Floating Shield Icon Left -->
  <g class="float-shield" transform="translate(100, 105)">
    <circle cx="75" cy="75" r="70" fill="#0f172a" stroke="url(#accentGrad)" stroke-width="2.5" filter="url(#glow)" />
    <!-- Chain & Shield Graphic -->
    <path d="M 75 35 L 115 50 V 85 C 115 112 75 125 75 125 C 75 125 35 112 35 85 V 50 Z" fill="url(#accentGrad)" opacity="0.15" />
    <path d="M 75 40 L 110 53 V 83 C 110 106 75 118 75 118 C 75 118 40 106 40 83 V 53 Z" fill="none" stroke="url(#accentGrad)" stroke-width="2.5" stroke-linejoin="round" />
    <!-- Checkmark & Lock combo -->
    <path d="M 62 76 L 71 85 L 90 66" fill="none" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#softGlow)" />
    <!-- Orbiting nodes -->
    <circle cx="75" cy="20" r="4" fill="#38bdf8">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite" />
    </circle>
    <circle cx="130" cy="75" r="4" fill="#34d399">
      <animate attributeName="opacity" values="1;0.3;1" dur="2.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="75" cy="130" r="4" fill="#818cf8">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2.2s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Main Content Title & Subtitles -->
  <g transform="translate(290, 85)">
    <!-- Category Pill Badge -->
    <g transform="translate(0, 0)">
      <rect width="260" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.6" />
      <circle cx="14" cy="14" r="4" fill="#10b981">
        <animate attributeName="r" values="3;5;3" dur="1.5s" repeatCount="indefinite" />
      </circle>
      <text x="26" y="18" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="1">CURATED ECOSYSTEM 2026</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="70" fill="url(#textGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="38" font-weight="800" letter-spacing="-0.5" filter="url(#softGlow)">
      Awesome Supply Chain Security
    </text>

    <!-- Tagline -->
    <text x="0" y="106" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="500">
      Enterprise SaaS Platforms &amp; Open-Source Projects Ecosystem
    </text>

    <!-- Pillar Tags -->
    <g transform="translate(0, 135)">
      <!-- Pill 1: SCA & SBOM -->
      <rect x="0" y="0" width="115" height="26" rx="6" fill="#0f172a" stroke="#0ea5e9" stroke-width="1" />
      <text x="10" y="17" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="600">🛡️ SCA &amp; SBOM</text>

      <!-- Pill 2: Provenance -->
      <rect x="125" y="0" width="145" height="26" rx="6" fill="#0f172a" stroke="#6366f1" stroke-width="1" />
      <text x="135" y="17" fill="#818cf8" font-family="sans-serif" font-size="11" font-weight="600">🔗 SLSA Provenance</text>

      <!-- Pill 3: Signatures -->
      <rect x="280" y="0" width="135" height="26" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1" />
      <text x="290" y="17" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="600">✍️ Cryptographic Sig</text>

      <!-- Pill 4: Malware Detection -->
      <rect x="425" y="0" width="155" height="26" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1" />
      <text x="435" y="17" fill="#fbbf24" font-family="sans-serif" font-size="11" font-weight="600">🔍 Malware Detection</text>

      <!-- Pill 5: CI/CD & ASPM -->
      <rect x="590" y="0" width="135" height="26" rx="6" fill="#0f172a" stroke="#ec4899" stroke-width="1" />
      <text x="600" y="17" fill="#f472b6" font-family="sans-serif" font-size="11" font-weight="600">⚡ CI/CD &amp; ASPM</text>
    </g>
  </g>

  <!-- Glowing Border Outline -->
  <rect x="1" y="1" width="1198" height="358" rx="15" fill="none" stroke="url(#accentGrad)" stroke-width="1.5" opacity="0.4" />
</svg>
