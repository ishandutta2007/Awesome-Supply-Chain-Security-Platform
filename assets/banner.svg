<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="accentGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </linearGradient>

    <!-- Filters for Neon Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Inline Keyframe Animations -->
    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.7; transform: scale(1.05); }
      }
      @keyframes floatShield {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-8px) rotate(2deg); }
      }
      @keyframes dashMove {
        to { stroke-dashoffset: -100; }
      }
      .anim-pulse {
        animation: pulseGlow 6s ease-in-out infinite;
        transform-origin: center;
      }
      .anim-shield {
        animation: floatShield 5s ease-in-out infinite;
        transform-origin: 180px 160px;
      }
      .anim-dash {
        stroke-dasharray: 8, 8;
        animation: dashMove 12s linear infinite;
      }
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        font-weight: 800;
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        font-weight: 500;
        letter-spacing: 0.5px;
      }
      .tag-text {
        font-family: 'SF Mono', Consolas, Monaco, monospace;
        font-weight: 600;
        font-size: 13px;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="320" rx="16" fill="url(#bgGrad)" />

  <!-- Geometric Grid Pattern Overlay -->
  <g opacity="0.12" stroke="#94a3b8" stroke-width="1">
    <line x1="0" y1="40" x2="1200" y2="40" />
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="220" x2="1200" y2="220" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="100" y1="0" x2="100" y2="320" />
    <line x1="300" y1="0" x2="300" y2="320" />
    <line x1="500" y1="0" x2="500" y2="320" />
    <line x1="700" y1="0" x2="700" y2="320" />
    <line x1="900" y1="0" x2="900" y2="320" />
    <line x1="1100" y1="0" x2="1100" y2="320" />
  </g>

  <!-- Glowing Radial Ambient Orbs -->
  <circle cx="180" cy="160" r="140" fill="#6366f1" opacity="0.25" filter="url(#glow)" class="anim-pulse" />
  <circle cx="950" cy="90" r="110" fill="#38bdf8" opacity="0.2" filter="url(#glow)" class="anim-pulse" style="animation-delay: -3s;" />

  <!-- Connecting Node Circuit (Dynamic Moving Dashes) -->
  <g stroke="#38bdf8" stroke-width="2" opacity="0.4" fill="none" class="anim-dash">
    <path d="M 270 160 L 360 160 L 400 200 L 520 200" />
    <path d="M 360 160 L 410 110 L 580 110" />
    <path d="M 980 160 L 1060 160 L 1110 210" />
  </g>

  <!-- Animated Shield & Supply Chain Lock Logo (Left Side) -->
  <g class="anim-shield">
    <path d="M 180 75 L 250 115 L 250 195 L 180 245 L 110 195 L 110 115 Z" 
          fill="url(#shieldGrad)" stroke="#38bdf8" stroke-width="3" filter="url(#softGlow)" />
    
    <circle cx="180" cy="125" r="10" fill="#ffffff" />
    <circle cx="145" cy="180" r="8" fill="#38bdf8" />
    <circle cx="215" cy="180" r="8" fill="#c084fc" />

    <line x1="180" y1="125" x2="145" y2="180" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" />
    <line x1="180" y1="125" x2="215" y2="180" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" />
    <line x1="145" y1="180" x2="215" y2="180" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" />
    
    <circle cx="180" cy="160" r="5" fill="#facc15" filter="url(#softGlow)" />
  </g>

  <!-- Typography & Text Content -->
  <g fill="#ffffff" transform="translate(320, 0)">
    <rect x="0" y="52" width="280" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <circle cx="14" cy="66" r="5" fill="#10b981" filter="url(#softGlow)" />
    <text x="28" y="71" fill="#94a3b8" class="tag-text">CURATED ECOSYSTEM • 2026</text>

    <text x="0" y="125" fill="url(#accentGrad1)" font-size="40" class="title-text" filter="url(#softGlow)">
      Supply Chain Security
    </text>
    <text x="0" y="165" fill="#f8fafc" font-size="34" class="title-text">
      Awesome Platform &amp; Tools
    </text>

    <text x="0" y="205" fill="#94a3b8" font-size="16" class="subtitle-text">
      Comprehensive Directory of SaaS Platforms, Open-Source Scanners, SBOM &amp; Provenance
    </text>

    <g transform="translate(0, 235)">
      <rect x="0" y="0" width="135" height="30" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" opacity="0.9" />
      <text x="14" y="20" fill="#38bdf8" class="tag-text">🛡️ SCA &amp; SBOM</text>

      <rect x="145" y="0" width="155" height="30" rx="6" fill="#0f172a" stroke="#818cf8" stroke-width="1.2" opacity="0.9" />
      <text x="158" y="20" fill="#818cf8" class="tag-text">🔐 SLSA &amp; Sigstore</text>

      <rect x="310" y="0" width="175" height="30" rx="6" fill="#0f172a" stroke="#ec4899" stroke-width="1.2" opacity="0.9" />
      <text x="323" y="20" fill="#f472b6" class="tag-text">👾 Malware Defense</text>

      <rect x="495" y="0" width="150" height="30" rx="6" fill="#0f172a" stroke="#34d399" stroke-width="1.2" opacity="0.9" />
      <text x="509" y="20" fill="#34d399" class="tag-text">⚡ CI/CD Integrity</text>
    </g>
  </g>

  <line x1="50" y1="316" x2="1150" y2="316" stroke="url(#lineGrad)" stroke-width="3" />
</svg>
